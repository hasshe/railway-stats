spring:
  application:
    name: railway-stats
  profiles:
    active: dev

vaadin:
  launch-browser: true
  production-mode: false

tripinfo:
  scheduling:
    prune-cron: "0 40 23 * * ?"
    collect-cron: "59 50 23 * * ?"
    metrics-refresh-cron: "0 59 23 * * ?"
    zone: "Europe/Stockholm"
  retention:
    days: 30
  retry:
    max-attempts: 3           # Total attempts (1 initial + 2 retries)
    initial-interval-ms: 5000 # Initial backoff delay in ms
    multiplier: 2.0           # Exponential backoff multiplier
    max-interval-ms: 60000    # Maximum backoff delay in ms

external:
  api:
    trip-search-url: "https://bff.malardalstrafik.se/v2/trip"
    claims-url: "https://evf-regionsormland.preciocloudapp.net/api/Claims"

